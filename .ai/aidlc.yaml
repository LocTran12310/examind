profile: none
ruleset: 7
layers: [domain, data, api, worker, web, infra, test]

evidence:
  command: "./scripts/verify.sh {tests}"
  timeout: 900
  output_ceiling: 8192
  aging_hours: 48

# Browser verification of a UoW's demo script (ai-dlc-verify). `local` is the compose stack on :8088;
# there is no staging or production yet, so nothing else is declared.
verify:
  environments:
    local: { url: "${LOCAL_URL}", required: true }
    # The end-to-end teaching-loop walk (.ai/e2e/teaching-loop) drives six sessions against this same stack:
    # a teacher who sets the paper, four students who sit it, and the teacher again to read the reports. The
    # runner loops environments on the OUTSIDE, so their order here is the order of the walk — which is why the
    # teacher appears twice under two names on one account. None of them is `required`: this is a regression
    # walk across features, not the evidence of any Unit of Work, and it must never stand between a gate and G4.
    # The parser does not read a map nested inside an inline map, so these are written out in block form —
    # inline, the whole `auth:` is silently dropped and every session lands on the teacher's page.
    e2e-teacher:
      url: "${LOCAL_URL}"
      required: false
      auth: { landing: /org/review, credentials_prefix: E2E_TEACHER }
    e2e-hs01:
      url: "${LOCAL_URL}"
      required: false
      auth: { landing: /home, credentials_prefix: E2E_HS01 }
    e2e-hs02:
      url: "${LOCAL_URL}"
      required: false
      auth: { landing: /home, credentials_prefix: E2E_HS02 }
    e2e-hs03:
      url: "${LOCAL_URL}"
      required: false
      auth: { landing: /home, credentials_prefix: E2E_HS03 }
    e2e-hs04:
      url: "${LOCAL_URL}"
      required: false
      auth: { landing: /home, credentials_prefix: E2E_HS04 }
    e2e-report:
      url: "${LOCAL_URL}"
      required: false
      auth: { landing: /org/exams, credentials_prefix: E2E_TEACHER }
  viewports:
    desktop: { width: 1440, height: 900 }
    mobile:  { width: 390, height: 844, isMobile: true }   # the app branches at 768; neither viewport sits on it
  auth:
    recipe: form
    # The form has three fields and the recipe fills two, so the org code is seeded into the browser the way
    # the app itself remembers it: `.ai/.auth/local.json` carries `examind.org_code` in localStorage, and the
    # runner loads that state before signing in (scripts/verify-seed-session.sh writes it).
    path: /login
    landing: /org/review
    selectors:
      user: "input[name=username]"
      password: "input[name=password]"
      submit: "button[type=submit]"
    ready_when: { gone: "text=Đang đăng nhập" }
  warmup: { attempts: 1 }
  failure_signals:
    - { selector: "[data-sonner-toast][data-type=error]", message: "ứng dụng báo lỗi" }
    - console_errors
