[project]
name = "examind-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "pyjwt>=2.9",
  "pwdlib[argon2]>=0.2",
  "boto3>=1.34",
  "python-multipart>=0.0.9",
  "structlog>=24.1",
  "openpyxl>=3.1",
  "unidecode>=1.3",
  "email-validator>=2.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx`"]

[tool.uv]
package = false
