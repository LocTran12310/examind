# ids are kept as they were, so tickets, commits and history still line up.

[feature]
title = "Exams, practice and statistics"
tier = "standard"
client = ""
imported_from = "ai-dlc:2026092203-exam-practice"

[[assumption]]
id = "A-01"
text = "An exam is an ordered list of questions grouped in sections by type (Phần I MCQ, II true/false, III short answer, IV essay); points per question default by type and can be overridden per exam"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-02"
text = "True/false partial credit (THPT 2025): 1 correct statement 0.1, 2 → 0.25, 3 → 0.5, 4 → 1 × question points; 0 correct → 0"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-03"
text = "Short answers compare after normalisation: trim, comma = dot decimal, fractions a/b evaluated, numeric equality within 1e-9; otherwise case-insensitive text equality without accents"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-04"
text = "Blueprint rows: {topic_id (subtree) or tag_id, type, difficulty?, count}; questions drawn from usable questions at random with a seed; the same question never appears twice; rows that cannot be filled report the shortfall"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-05"
text = "Assignment: exam → one or more classes and/or students, open_at, close_at, duration (minutes), max_attempts (default 1), shuffle questions/options, results policy (after_submit / after_close / never)"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-06"
text = "Attempt deadline = min(started_at + duration, close_at) + 30 s grace; after it the attempt is finalised with the saved answers"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-07"
text = "Answers autosave on every change (debounced 500 ms client-side); the server stores the latest value per question"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-08"
text = "Essays are graded by teachers (score 0..points + comment); an attempt with ungraded essays shows \"Đang chấm\" for those points"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-09"
text = "Stats are computed from `answer_facts` (one row per graded answer with the question's primary topic path, tag ids, type, difficulty, points, max) and roll up topic levels with ltree"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-10"
text = "Students see only their own attempts and assignments of their classes; teachers see everything in the org"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-11"
text = "Questions used by an exam cannot be hard-deleted (bank delete → 409); editing a question after an exam was taken does not change past answers' grades (answers store the graded snapshot)"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-12"
text = "Tab switches during an attempt are counted and shown to the teacher; no blocking"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[ac]]
id = "AC-01"
title = "Blueprint"
story = "US-01 — Build an exam"
given = "usable questions in the bank"
when = "I create an exam \"Kiểm tra 15 phút\" with rows (Đại số · mcq · 6), (Hình học · mcq · 4)"
then = "10 distinct questions are drawn from those topic subtrees and grouped in section \"Phần I\", and a row that cannot be filled reports \"thiếu N câu\""

[[ac]]
id = "AC-02"
title = "Manual edit"
story = "US-01 — Build an exam"
given = "an exam"
when = "I add questions from a bank search, remove one, reorder, or swap one for another random question of the same row"
then = "the exam's question list and total points update"

[[ac]]
id = "AC-03"
title = "Scoring settings"
story = "US-01 — Build an exam"
given = "an exam with MCQ, true/false and short-answer questions"
when = "I open its settings"
then = "default points are 0.25 / 1 / 0.5 and I can change points per type or per question, and the total is shown"

[[ac]]
id = "AC-04"
title = "Preview"
story = "US-01 — Build an exam"
given = "an exam"
when = "I open \"Xem trước\""
then = "I see it exactly as students will (exam mode, no answers) and can toggle to show answers and solutions"

[[ac]]
id = "AC-05"
title = "Create assignment"
story = "US-02 — Assign an exam"
given = "an exam and class \"10A1\""
when = "I assign it with open/close time, duration 45 minutes, 1 attempt, shuffle on, results \"after submit\""
then = "every student of 10A1 sees it on their home page during the window"

[[ac]]
id = "AC-06"
title = "Window enforcement"
story = "US-02 — Assign an exam"
given = "an assignment not yet open, or closed"
when = "a student tries to start it"
then = "it is refused with the reason"

[[ac]]
id = "AC-07"
title = "Start and timer"
story = "US-03 — Take an exam"
given = "an open assignment"
when = "I start it"
then = "I see the questions (shuffled if configured, answers hidden), a countdown to my deadline and a question navigator"

[[ac]]
id = "AC-08"
title = "Autosave and resume"
story = "US-03 — Take an exam"
given = "I answered some questions"
when = "I reload the page or switch device"
then = "my answers and remaining time are restored"

[[ac]]
id = "AC-09"
title = "Submit and auto-close"
story = "US-03 — Take an exam"
given = "I click \"Nộp bài\" and confirm, or my time runs out"
when = "Submit and auto-close"
then = "the attempt is finalised; answers sent after the deadline are refused"

[[ac]]
id = "AC-10"
title = "Tab switches"
story = "US-03 — Take an exam"
given = "I leave the exam tab during an attempt"
when = "I come back"
then = "the switch is counted and visible to the teacher"

[[ac]]
id = "AC-11"
title = "Auto grading"
story = "US-04 — Grading and results"
given = "a submitted attempt"
when = "Auto grading"
then = "MCQ, true/false (partial credit) and short answers are graded immediately and the total score is shown out of 10 (scaled)"

[[ac]]
id = "AC-12"
title = "Result page"
story = "US-04 — Grading and results"
given = "results policy \"after submit\""
when = "I open my result"
then = "each question shows my answer, the correct answer and the solution (QuestionView result mode), and a breakdown by section and by topic"

[[ac]]
id = "AC-13"
title = "Results policy"
story = "US-04 — Grading and results"
given = "policy \"after close\" or \"never\""
when = "I open my result before the close time (or ever, for never)"
then = "I see only my total, without answers or solutions"

[[ac]]
id = "AC-14"
title = "Essay grading"
story = "US-04 — Grading and results"
given = "an attempt with essay answers"
when = "the teacher enters points and a comment for each essay"
then = "the attempt total updates and the student sees the comment"

[[ac]]
id = "AC-15"
title = "Snapshot integrity"
story = "US-04 — Grading and results"
given = "a question edited after students answered it"
when = "their results are shown"
then = "they keep the grade computed at submission; and the question cannot be deleted from the bank"

[[ac]]
id = "AC-16"
title = "Assignment report"
story = "US-05 — Reports"
given = "submitted attempts"
when = "I open the assignment report"
then = "I see submitted/not-submitted students, average, score distribution, and per question % correct with the most chosen wrong option"

[[ac]]
id = "AC-17"
title = "Topic tree stats"
story = "US-05 — Reports"
given = "graded answers"
when = "I open \"Theo chuyên đề\""
then = "I see the knowledge tree with % correct at every level (roll-up of descendants), expandable"

[[ac]]
id = "AC-18"
title = "Other dimensions"
story = "US-05 — Reports"
given = "graded answers"
when = "I group by tag, question type or difficulty"
then = "I see % correct and number of answers per group, filterable by class and date range"

[[ac]]
id = "AC-19"
title = "Heatmap"
story = "US-05 — Reports"
given = "a class"
when = "I open the class heatmap"
then = "rows are students, columns are top-level topics (strands) or topics, cells are % correct coloured"

[[ac]]
id = "AC-20"
title = "Home"
story = "US-06 — Student home and stats"
given = "assignments for my classes"
when = "I open /home"
then = "I see \"Đang mở\", \"Sắp tới\" and \"Đã làm\" with scores"

[[ac]]
id = "AC-21"
title = "My stats"
story = "US-06 — Student home and stats"
given = "my graded answers"
when = "I open \"Tiến độ của tôi\""
then = "I see my % correct by topic tree level and by type, weakest topics first"

[[ac]]
id = "AC-22"
title = "Navigation"
story = "US-06 — Student home and stats"
given = "the growing number of pages"
when = "staff use the app"
then = "navigation is a grouped sidebar (Đề & câu hỏi, Lớp & học sinh, Báo cáo, Cài đặt) that works on phones"

[[decision]]
id = "ADR-01"
title = "answer_facts written at grading time"
status = "accepted"
choice = "** One denormalised row per graded answer with the question's primary topic path and tags at grading time; aggregates are GROUP BY queries with ltree roll-up"

[[decision]]
id = "ADR-02"
title = "Server-authoritative deadlines with lazy + swept closing"
status = "accepted"
choice = "** `deadline_at` fixed at start; every attempt access finalises an expired attempt; the worker sweeps expired in-progress attempts every minute"

[[decision]]
id = "ADR-03"
title = "Grading snapshot per answer"
status = "accepted"
choice = "** `attempt_answers.key_snapshot` stores the answer key used; points are computed once at submission (essays when graded)"

[[decision]]
id = "ADR-04"
title = "Pure scoring module"
status = "accepted"
choice = "** `app/services/scoring.py` with pure functions per type; configurable points and scale"

[[decision]]
id = "ADR-05"
title = "Grouped sidebar navigation"
status = "accepted"
choice = "** Sidebar with groups (Đề & câu hỏi, Lớp & học sinh, Báo cáo, Cài đặt); collapses to a drawer on phones; students keep a minimal top bar"

[[decision]]
id = "ADR-06"
title = "Shuffled options are relabelled per attempt"
status = "accepted"
choice = "** The student view relabels options A–D in the attempt's order; answers are mapped back to the original label before storage; results map key and response back to display labels"

[[slice]]
id = "UOW-01"
title = "Teachers build exams from blueprints or by hand"
covers = ["AC-01", "AC-02", "AC-03", "AC-04", "AC-05", "AC-07", "AC-11", "AC-15", "AC-17", "AC-22"]
demo = """
1. Staff pages use the new grouped sidebar (also on a 375 px phone as a drawer)
2. Open /org/exams → 'Tạo đề' → title 'Kiểm tra 15 phút', rows (Đại số · Trắc nghiệm · 6), (Hình học · Trắc nghiệm · 4) → 10 questions
3. Add a row that cannot be filled → 'thiếu N câu' warning
4. Swap one question, remove one, add one from bank search, drag to reorder; change MCQ points to 0.5 → total updates
5. 'Xem trước' shows the exam as students see it; toggle answers
6. Try deleting a used question in the bank → 'đang được dùng trong đề'"""

[[slice]]
id = "UOW-02"
title = "Students take assigned exams with a timer and autosave"
covers = ["AC-05", "AC-06", "AC-07", "AC-08", "AC-09", "AC-10", "AC-11", "AC-15", "AC-20"]
demo = """
1. Assign 'Kiểm tra 15 phút' to 10A1: now → +1 day, 15 minutes, shuffle on, results after submit
2. Log in as a 10A1 student → /home shows it under 'Đang mở'
3. Start → countdown, navigator, answers hidden; answer 5 questions, reload → answers and time restored
4. Switch tab and back → counted
5. Submit → score out of 10 appears immediately
6. Start an assignment whose window closed → refused"""

[[slice]]
id = "UOW-03"
title = "Students see feedback; teachers grade essays"
covers = ["AC-12", "AC-13", "AC-14"]
demo = """
1. Student opens the result: each question shows their answer, the key and the solution; breakdown by section and topic
2. An 'after close' assignment shows only the total before closing
3. Teacher opens an attempt with an essay, gives 1.5/2 with a comment → student total updates and shows the comment"""

[[slice]]
id = "UOW-04"
title = "Teachers and students see where marks were lost"
covers = ["AC-16", "AC-17", "AC-18", "AC-19", "AC-21"]
demo = """
1. Assignment report: submitted/not submitted, average, distribution, per-question % correct and most-chosen wrong option
2. 'Theo chuyên đề': tree with % correct at every level (Đại số 70% › Hàm số bậc hai 60% › …)
3. Group by tag / type / difficulty; filter by class
4. Class heatmap students × strands
5. Student 'Tiến độ của tôi': weakest topics first"""

