[[assumption]]
id = "A-01"
text = "shadcn style new-york, base colour neutral, brand blue as `--primary`; font Be Vietnam Pro kept"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-02"
text = "Theme default follows the OS; the choice (light/dark/system) is stored per browser by next-themes"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-03"
text = "Table toolbar actions per screen: Thêm mới, Sửa (1 selected), Xóa (≥1, confirm), Nạp; Nhập/Xuất only where import/export exists (users)"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-04"
text = "Column filters: text = case/accent-insensitive contains (unaccent ILIKE), select = exact, date = from/to; debounce 300 ms; page sizes 20/50/100, default 20"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-05"
text = "URL param names: `q`, `page`, `page_size`, `sort` (`field` or `-field`), and one param per column filter named after the API field"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-06"
text = "Bare-list endpoints become `Page`; small reference lists used by pickers (topics tree, taxonomy, tags for pickers) keep an unpaged variant via `page_size=all` capped at 1000"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-07"
text = "Students use the same shell; header org switcher shows the current org only until F7"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-08"
text = "Detail panel under the table (\"Chi tiết\") for exams → questions and classes → students; other lists open a page or dialog"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-09"
text = "Existing web tests are rewritten against the new markup; coverage kept at least at today's 84 cases"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[ac]]
id = "AC-01"
title = "shadcn only"
story = "US-01 — shadcn foundation and theme"
given = "the web source"
when = "I list apps/web/src/components/ui"
then = "it contains only files generated by the shadcn CLI and no source file imports the old barrel \"@/components/ui\""

[[ac]]
id = "AC-02"
title = "Theme switch"
story = "US-01 — shadcn foundation and theme"
given = "any page"
when = "I choose Sáng, Tối or Hệ thống in the header"
then = "the page re-renders in that theme without reload, the choice persists after refresh, and math and images stay readable"

[[ac]]
id = "AC-03"
title = "Sidebar by role"
story = "US-02 — App shell"
given = "I am signed in as a teacher, org admin, super admin or student"
when = "the app renders"
then = "the left sidebar shows only the groups and items for my role, with icons, the active item highlighted, and it can collapse to icons"

[[ac]]
id = "AC-04"
title = "Header"
story = "US-02 — App shell"
given = "I am signed in"
when = "I look at the top-right of the header"
then = "I see the organisation selector with my current organisation, a theme button, and my avatar menu with name, role, \"Đổi mật khẩu\" and \"Đăng xuất\""

[[ac]]
id = "AC-05"
title = "Mobile"
story = "US-02 — App shell"
given = "a viewport narrower than 768 px"
when = "I open the menu button"
then = "the sidebar opens as a sheet and closes after navigation"

[[ac]]
id = "AC-06"
title = "Column search row"
story = "US-03 — Server-side DataTable"
given = "a list with a search row under the headers"
when = "I type in a column filter"
then = "after 300 ms the URL search params change and the server is asked with that filter; rows are never filtered in the browser"

[[ac]]
id = "AC-07"
title = "Pagination"
story = "US-03 — Server-side DataTable"
given = "more rows than the page size"
when = "I use « ‹ › », type a page number or change the page size"
then = "the URL changes, the server returns that page, and the footer shows \"Hiển thị a–b trên T kết quả\""

[[ac]]
id = "AC-08"
title = "Link restores state"
story = "US-03 — Server-side DataTable"
given = "a URL with q, column filters, sort, page and page_size"
when = "I open it"
then = "the first request already carries those parameters and the inputs show them"

[[ac]]
id = "AC-09"
title = "Selection and toolbar"
story = "US-03 — Server-side DataTable"
given = "rows with checkboxes"
when = "I select rows"
then = "Sửa is enabled only for exactly one row, Xóa for one or more after a confirmation dialog, and Nạp reloads the current page"

[[ac]]
id = "AC-10"
title = "Paged API"
story = "US-03 — Server-side DataTable"
given = "any list endpoint used by a table"
when = "it is called with q, sort, page, page_size and column filters"
then = "it returns {items, total, page, page_size} filtered and sorted on the server"

[[ac]]
id = "AC-11"
title = "Lists migrated"
story = "US-04 — Screens on the new components"
given = "the lists organisations, users, classes, documents, review, question bank, exams, assignments, AI models and tags"
when = "I open each"
then = "it uses the DataTable (bank keeps its question cards) with its column filters and toolbar"

[[ac]]
id = "AC-12"
title = "Flows unchanged"
story = "US-04 — Screens on the new components"
given = "the upload, review queue, question editor, exam builder, exam runner, results, reports and topic tree"
when = "I use them in light and dark mode"
then = "they behave as before with shadcn components (dialogs, selects, buttons, toasts)"

[[decision]]
id = "ADR-01"
title = "shadcn components verbatim"
status = "accepted"
choice = "** `components/ui/` holds only CLI-generated files; app composites live elsewhere; ESLint forbids the old barrel import"

[[decision]]
id = "ADR-02"
title = "URL is the table state"
status = "accepted"
choice = "** `useTableQuery` reads/writes `useSearchParams`; the API does all filtering, sorting and paging"

[[decision]]
id = "ADR-03"
title = "One paging helper on the API"
status = "accepted"
choice = "** `app/services/paging.py` applies q / column filters / sort / page to a select from a declared column map and returns `Page`"

[[decision]]
id = "ADR-04"
title = "TanStack Table in manual mode"
status = "accepted"
choice = "** `@tanstack/react-table` with manualPagination/manualSorting/manualFiltering"

[[decision]]
id = "ADR-05"
title = "shadcn NativeSelect in dense forms, Radix Select in tables and filters"
status = "accepted"
choice = "** Forms with many inline selects use shadcn `NativeSelect` (a shadcn component, styled with the theme); table filters, toolbars and single-choice form fields use Radix `Select` through `components/app/OptionSelect`"

[[decision]]
id = "ADR-06"
title = "TanStack Table pinned to v8"
status = "accepted"
choice = "** Pin `@tanstack/react-table@^8` until the shadcn guide moves to v9"

[[slice]]
id = "UOW-01"
title = "shadcn foundation, theme and app shell"
covers = ["AC-01", "AC-02", "AC-03", "AC-04", "AC-05"]
demo = """
1. Sign in as trungtama/admin → left sidebar with icons, header right: org, theme, avatar menu
2. Toggle Tối → whole app dark, refresh keeps it; collapse sidebar to icons
3. Sign in as a student → same shell with student menu; phone width → menu opens as a sheet"""

[[slice]]
id = "UOW-02"
title = "Server-side DataTable with URL state on users, organisations, classes"
covers = ["AC-06", "AC-07", "AC-08", "AC-09", "AC-10", "AC-11"]
demo = """
1. Users: type 'bui' in Họ tên filter → URL ?full_name=bui, request carries it, 20/page
2. Open the copied URL in a new tab → same rows, inputs filled
3. Tick 2 users → Xóa asks to confirm; Sửa disabled; Nạp reloads
4. Organisations and Classes use the same table"""

[[slice]]
id = "UOW-03"
title = "All remaining lists on the DataTable"
covers = ["AC-08", "AC-10", "AC-11"]
demo = """
1. Documents, review, exams, assignments, AI models, tags: column filters + paging from the server
2. Exams: select a row → detail panel lists its questions
3. Bank: filters on the left + search, pages from the server, cards unchanged"""

[[slice]]
id = "UOW-04"
title = "Every other screen on shadcn components, old barrel removed"
covers = ["AC-01", "AC-12"]
demo = """
1. Upload a document, review with hotkeys, edit a question, build and take an exam, see results and reports — in dark mode
2. `grep -r "@/components/ui\\""` finds nothing; lint forbids it"""

