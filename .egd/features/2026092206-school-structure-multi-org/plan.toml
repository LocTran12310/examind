# Imported from ai-dlc (ai-dlc:2026092206-school-structure-multi-org) on 2026-10-05.
# ids are kept as they were, so tickets, commits and history still line up.

[feature]
title = "School structure and users in several organisations"
tier = "standard"
client = ""
imported_from = "ai-dlc:2026092206-school-structure-multi-org"

[[assumption]]
id = "A-01"
text = "A school level (Cấp học) is an org-owned entity: code, name, grade range, sort; new orgs get THCS 6–9 and THPT 10–12; Tiểu học is not seeded"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-02"
text = "A grade (Khối) belongs to exactly one level; its grade number must lie in the level's range and is unique per org"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-03"
text = "A class belongs to one grade (`grade_id`); the old integer `classes.grade` stays as a cache so bank/exam filters keep working"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-04"
text = "Deleting a level with grades, or a grade with classes, is refused (409 with the count); classes are deleted from the class list as today"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-05"
text = "`users.organization_id` is the home org (where the username lives and the user logs in); `organization_members` holds (user, org, role, is_active) and is the source of permissions per org"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-06"
text = "Roles are per org; `users.role` mirrors the home membership so existing code keeps a meaning"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-07"
text = "After login the last used org opens (`users.last_org_id`) if its membership is still active and the org can log in; otherwise the home org"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-08"
text = "Switching org re-issues the access token; the refresh token follows `last_org_id`"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-09"
text = "Super admin sees every org in the selector and works inside it with org_admin rights; audit records the super admin as actor"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-10"
text = "An org admin (or super admin) of the target org adds an existing account by home org code + username and a role; removing a membership never deletes the account; the home membership cannot be removed"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-11"
text = "A suspended target org disappears from the selector; if it was active, the next request falls back to the home org"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-12"
text = "The org detail \"Thành viên\" tab from the chat plan is replaced by \"Vào tổ chức\" (switch) + the normal Users page"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[ac]]
id = "AC-01"
title = "Seeded on create"
story = "US-01 — School levels and grades"
given = "a super admin creates an organisation"
when = "it is created"
then = "it has levels THCS (khối 6–9) and THPT (khối 10–12) with grades 6…12 attached"

[[ac]]
id = "AC-02"
title = "CRUD with guards"
story = "US-01 — School levels and grades"
given = "levels and grades exist"
when = "an org admin adds, renames or deletes a level or grade"
then = "grade numbers must fit the level's range and be unique, and deleting a level with grades or a grade with classes is refused with the count"

[[ac]]
id = "AC-03"
title = "Backfill"
story = "US-01 — School levels and grades"
given = "data from before the migration"
when = "the migration runs"
then = "every existing grade is attached to the level whose range contains it and every class with a grade number gets the matching grade_id"

[[ac]]
id = "AC-04"
title = "Tree with counts"
story = "US-02 — Structure page"
given = "the org's structure"
when = "I open \"Cơ cấu trường\""
then = "a tree shows levels, grades and classes with class and student counts"

[[ac]]
id = "AC-05"
title = "Contextual table"
story = "US-02 — Structure page"
given = "I select a node in the tree"
when = "it is a level, a grade or a class"
then = "the right side shows the level's grades, the grade's classes or the class's students in a server-paged table with add/edit/delete"

[[ac]]
id = "AC-06"
title = "Class form uses the structure"
story = "US-02 — Structure page"
given = "I create or edit a class anywhere"
when = "I pick its grade"
then = "the grades are grouped by level and the class stores grade_id and grade"

[[ac]]
id = "AC-07"
title = "Header selector"
story = "US-03 — Membership and switching"
given = "I belong to several organisations (or I am super admin)"
when = "I open the organisation selector in the header"
then = "I see those organisations (all of them for super admin) and choosing one reloads the app inside it"

[[ac]]
id = "AC-08"
title = "Scope enforced"
story = "US-03 — Membership and switching"
given = "I switched to organisation B"
when = "I call any API"
then = "results come only from B, with my role in B, and a token for an org where my membership was removed or disabled is rejected"

[[ac]]
id = "AC-09"
title = "Login lands on the last org"
story = "US-03 — Membership and switching"
given = "I switched to B before logging out"
when = "I log in again with my home org code"
then = "the app opens in B if my membership is still active, else in my home org"

[[ac]]
id = "AC-10"
title = "Suspended org"
story = "US-03 — Membership and switching"
given = "organisation B is suspended"
when = "I open the selector or refresh my session"
then = "B is not offered and I am put back in my home organisation"

[[ac]]
id = "AC-11"
title = "Link an account"
story = "US-04 — Accounts from other organisations"
given = "a teacher account exists in organisation B"
when = "an org admin of A adds it by B's code and the username with a role"
then = "the user appears in A's user list with that role and a \"Từ B\" badge, and can switch to A"

[[ac]]
id = "AC-12"
title = "Unlink"
story = "US-04 — Accounts from other organisations"
given = "a linked member of A"
when = "the org admin removes the membership"
then = "the account still exists in B, loses access to A, and its A class memberships are removed; the home membership cannot be removed"

[[ac]]
id = "AC-13"
title = "Per-org roles in checks"
story = "US-04 — Accounts from other organisations"
given = "a user is a teacher in A and a student in B"
when = "A assigns reviewers or B assigns exams to students"
then = "each check uses the role in that organisation"

[[decision]]
id = "ADR-01"
title = "Levels and grades are org-owned rows"
status = "accepted"
choice = "** `school_levels` table with a grade range; grades hang off a level; classes point to a grade"

[[decision]]
id = "ADR-02"
title = "Home org + memberships"
status = "accepted"
choice = "** `users.organization_id` = home org (login namespace); `organization_members` = rights per org"

[[decision]]
id = "ADR-03"
title = "The token carries the active org; every request re-checks membership"
status = "accepted"
choice = "** `org_id` in the access token; `deps` verifies an active membership (or super admin) and org status on each request; `last_org_id` drives refresh and login"

[[decision]]
id = "ADR-04"
title = "Super admin works inside orgs as org_admin"
status = "accepted"
choice = "** `OrgScope.is_super` + role `org_admin` in non-system orgs; system org keeps `super_admin`"

[[slice]]
id = "UOW-01"
title = "Cấp học › Khối › Lớp › Học sinh"
covers = ["AC-01", "AC-02", "AC-03", "AC-04", "AC-05", "AC-06"]
demo = """
1. Create org TrungtamC → Cơ cấu trường shows THCS (6–9) and THPT (10–12)
2. In trungtama: THPT › Khối 10 → add class 10A2 → select it → add/import students
3. Delete Khối 10 while it has classes → refused 'còn 2 lớp'
4. Class dialog on Lớp học shows grades grouped by level"""

[[slice]]
id = "UOW-02"
title = "Active organisation in the token, header selector"
covers = ["AC-07", "AC-08", "AC-09", "AC-10"]
demo = """
1. Super admin opens the selector → all orgs → picks Trung tâm A → users/classes of A
2. Log out and in again → lands in Trung tâm A
3. Suspend Trung tâm A as super admin → selector no longer offers it; session falls back to system"""

[[slice]]
id = "UOW-03"
title = "Accounts from other organisations"
covers = ["AC-11", "AC-12", "AC-13"]
demo = """
1. Org admin of A: Người dùng → 'Thêm tài khoản có sẵn' → ttb / gvlan / Giáo viên → row with badge 'Từ ttb'
2. gvlan logs in with ttb → switches to A → sees A's classes; is teacher in A
3. Admin of A removes the membership → gvlan's next request in A is refused, account still works in ttb"""

