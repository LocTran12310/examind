[[proof]]
id = "P-4"
kind = "ui"
title = "Hai lời giải trong ảnh báo lỗi, xem trước trên form soạn câu hỏi"
verifies = ["AC-1.1", "AC-1.2"]
viewports = ["desktop", "mobile"]

[[proof.step]]
name = "form soạn câu hỏi"
goto = "/org/bank/new"
wait_for = "[data-testid=solution]"
screenshot = false

# only typed into the editor, never saved — the preview is the same Markdown component the student sees
[[proof.step]]
name = "xem trước lời giải"
fill = { "[data-testid=solution]" = '''**Đáp án:** $3,48$

$T=5\cos \left( 2\pi -x \right)-4\sin \left( 2025\pi +x \right)=5\cos x-4\sin \left( \pi +x \right)=5\cos x+4\sin x$

Có $1+{{\cot }^{2}}x=\frac{1}{{{\sin }^{2}}x}\Leftrightarrow 1+{{\left( -3 \right)}^{2}}=\frac{1}{{{\sin }^{2}}x}\Leftrightarrow {{\sin }^{2}}x=\frac{1}{10}$.

Giả thiết $\frac{3\pi }{2}<x<2\pi $ nên $\sin x<0$. Vậy $\sin x=-\frac{1}{\sqrt{10}}$.

$\cot x=\frac{\cos x}{\sin x}\Rightarrow \cos x=\cot x.\sin x=\left( -3 \right)\left( -\frac{1}{\sqrt{10}} \right)=\frac{3}{\sqrt{10}}$.

$T=5\cos x+4\sin x=5.\frac{3}{\sqrt{10}}+4.\left( -\frac{1}{\sqrt{10}} \right)=\frac{11}{\sqrt{10}}\simeq 3,48$.

**Chọn D**

$-Ở góc phần tư thứ tư thì : \sin \alpha <0;\cos \alpha >0;\tan \alpha <0;\cot \alpha <0.$

$\Rightarrow $ chỉ có **C** thỏa mãn.''' }
wait_for = "[data-testid=solution-preview] .katex"
full_page = false
# the Vietnamese is a text node of the paragraph itself, not letters inside KaTeX
expect = { visible = ["xpath=//div[@data-testid='solution-preview']//p[contains(text(), 'Ở góc phần tư thứ tư thì')]", "[data-testid=solution-preview] .katex-html"], hidden = ["[data-testid=solution-preview] .katex-error"] }
