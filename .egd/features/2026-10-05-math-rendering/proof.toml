[[proof]]
id = "P-1"
kind = "cli"
title = "Mọi class bộ render katex viết ra đều có trong CSS mà layout nạp"
verifies = ["AC-1.1"]

[[proof.step]]
name = "Mọi class bộ render katex viết ra đều có trong CSS mà layout nạp"
run = "cd apps/web && pnpm exec vitest run src/__tests__/markdown.test.tsx -t 'math-rendering AC-1.1'"
expect = { exit = 0, contains = "Tests  1 passed" }

