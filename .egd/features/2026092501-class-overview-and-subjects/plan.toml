[feature]
title = "nhìn được cả lớp, và biết một học sinh đã làm gì lúc nào"
tier = "standard"
client = ""
imported_from = "ai-dlc:2026092501-class-overview-and-subjects"

[[assumption]]
id = "A-01"
text = "\"Bao nhiêu phút\" là `submitted_at − started_at` (giờ treo tường), không phải tổng `seconds_spent` của từng câu"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval; đúng chữ anh viết — \"từ lúc start đến lúc nộp\". Hai đại lượng khác nhau: `seconds_spent` đo thời gian một câu ở trên màn hình và bị kẹp theo cửa sổ lượt làm (F14 ADR-01), còn cái này đo cả lượt"

[[assumption]]
id = "A-02"
text = "Một lượt bị hệ thống tự nộp khi hết giờ vẫn hiện trong lịch sử, có dấu riêng"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval; giấu nó đi thì cột thời gian sẽ nói dối về những lượt bỏ dở"

[[assumption]]
id = "A-03"
text = "Trên dữ liệu seed mọi lượt sẽ hiện 0 phút, và đó là đúng"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval; script seed trả lời cả bài trong chưa tới một giây, nên hiệu số thật sự bằng 0. Không sửa seed cho số đẹp — một cột thời gian bịa còn tệ hơn một cột thời gian trống"

[[assumption]]
id = "A-04"
text = "\"Tổng quan cả lớp\" là tab thứ hai cạnh danh sách học sinh, không phải một trang mới"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval; anh viết \"Chi tiết section thêm tab\""

[[assumption]]
id = "A-05"
text = "Tổng quan lớp gồm: số bài giao và số bài đã nộp, điểm trung bình, phổ điểm, và chuyên đề lớp yếu nhất"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval; đây là bốn thứ Báo cáo đã trả lời được khi lọc theo lớp, chỉ là đang bắt người ta rời trang để lấy"

[[assumption]]
id = "A-06"
text = "Bộ chọn môn ở Báo cáo giữ nguyên lựa chọn \"Mọi môn\" làm mặc định"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval; đổi mặc định là đổi **nghĩa** của con số trang chủ báo cáo mà không ai được báo. Thêm lựa chọn thì an toàn, đổi mặc định thì không"

[[assumption]]
id = "A-07"
text = "Ở \"Mọi môn\", cây chuyên đề nhóm theo môn thay vì phẳng"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval; đây chính là thứ anh nêu — phẳng thì không biết môn nào với môn nào"

[[assumption]]
id = "A-08"
text = "Thứ tự menu mới: Năm học · Cơ cấu trường · Lớp học · Người dùng"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval; đúng thứ tự anh viết"

[[assumption]]
id = "A-09"
text = "Lịch sử làm bài đọc được bởi giáo viên và quản trị (trang hồ sơ), và bởi chính học sinh về mình"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval; theo đúng quy tắc vai lồng nhau đã chốt ở F20"

[[ac]]
id = "AC-01"
title = "Lịch sử làm bài trên hồ sơ học sinh"
story = "US-01 — Biết một học sinh đã làm gì, lúc nào, mất bao lâu"
given = "một học sinh đã nộp vài bài"
when = "tôi mở hồ sơ em ấy"
then = "tôi thấy từng lượt làm bài: tên đề, lúc bắt đầu, lúc nộp, số phút từ bắt đầu đến nộp, và điểm"

[[ac]]
id = "AC-02"
title = "Lượt bị tự nộp vẫn hiện, và nói rõ là tự nộp"
story = "US-01 — Biết một học sinh đã làm gì, lúc nào, mất bao lâu"
given = "một lượt làm bài hết giờ và bị hệ thống tự nộp"
when = "tôi xem lịch sử làm bài"
then = "lượt ấy vẫn nằm trong danh sách và được đánh dấu là tự nộp, không bị giấu đi"

[[ac]]
id = "AC-03"
title = "Tab tổng quan của lớp"
story = "US-02 — Nhìn được cả lớp mà không phải rời trang"
given = "một lớp đã có bài giao và bài nộp"
when = "tôi mở lớp ấy"
then = "tôi chọn được giữa \"Học sinh\" và \"Tổng quan\", và Tổng quan cho tôi số bài giao, số bài đã nộp, điểm trung bình, phổ điểm và những chuyên đề cả lớp yếu nhất"

[[ac]]
id = "AC-04"
title = "Lớp chưa có bài nộp thì nói thẳng"
story = "US-02 — Nhìn được cả lớp mà không phải rời trang"
given = "một lớp chưa ai nộp bài"
when = "tôi mở tab Tổng quan"
then = "màn hình nói rõ chưa có dữ liệu, không hiện một con số 0 trông như đã đo"

[[ac]]
id = "AC-05"
title = "Chọn môn, và mặc định không đổi nghĩa"
story = "US-03 — Báo cáo còn đọc được khi trung tâm dạy nhiều môn"
given = "trung tâm có nhiều hơn một môn"
when = "tôi mở Báo cáo theo chuyên đề"
then = "mặc định vẫn là mọi môn như trước, và tôi chọn được một môn để chỉ xem môn ấy"

[[ac]]
id = "AC-06"
title = "Ở \"Mọi môn\", mỗi môn một khối"
story = "US-03 — Báo cáo còn đọc được khi trung tâm dạy nhiều môn"
given = "báo cáo đang ở \"Mọi môn\""
when = "tôi xem cây chuyên đề"
then = "các mạch kiến thức được nhóm dưới môn của chúng, không nằm phẳng cạnh nhau"

[[ac]]
id = "AC-07"
title = "Thứ tự nhóm \"Lớp & học sinh\""
story = "US-04 — Menu đi theo trình tự làm việc"
given = "(see the requirement)"
when = "tôi nhìn thanh điều hướng"
then = "nhóm \"Lớp & học sinh\" theo thứ tự Năm học · Cơ cấu trường · Lớp học · Người dùng"

