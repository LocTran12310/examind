[feature]
title = "đề thuộc khối nào, ôn cá nhân đã giao gì, và xếp lớp không phải gõ từng em"
tier = "standard"
client = ""
imported_from = "ai-dlc:2026092601-exam-labels-and-roster-fill"

[[assumption]]
id = "A-01"
text = "\"Lớp\" của một đề là khối (10/11/12) lấy từ `taxonomy.grades`, không phải một lớp học cụ thể như 12A1"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval; cột đã tên là \"Lớp\", lọc `kind: number`, và `exams.grade` là `int` — một lớp cụ thể sẽ là `class_id`, không phải con số này"

[[assumption]]
id = "A-02"
text = "Môn và Lớp đều không bắt buộc khi tạo đề"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval; API để cả hai `None`, và một đề nháp chưa biết dạy khối nào vẫn phải tạo được. Đặt sau ở trang soạn đề"

[[assumption]]
id = "A-03"
text = "Ô \"Đề ôn cá nhân\" hiện lượt giao gần nhất đầy đủ, cộng một dòng đếm khi có nhiều hơn một"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval; liệt kê hết làm bảng 25 dòng cao gấp ba mà câu hỏi thường trực chỉ là \"em ấy đang phải làm đề nào\" — xem ADR-02"

[[assumption]]
id = "A-04"
text = "\"Quá hạn\" = `close_at` đã qua và em ấy chưa nộp"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval; đã nộp rồi thì hạn không còn nghĩa gì để cảnh báo"

[[assumption]]
id = "A-05"
text = "Thêm từ lớp cũ: mặc định tích sẵn mọi học sinh của lớp nguồn, bỏ tích được từng em"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval; anh viết \"chọn toàn lớp\" — mặc định phải là cả lớp, còn bỏ ra vài em là ngoại lệ"

[[assumption]]
id = "A-06"
text = "Lớp nguồn chọn được là mọi lớp khác của tổ chức, mọi năm học, mới trước"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval; giới hạn vào năm liền trước là đoán: một lớp mới có thể gom từ hai lớp cũ, hoặc từ lớp cùng năm khi tách lớp"

[[assumption]]
id = "A-07"
text = "Học sinh đã ở trong lớp đích thì bỏ qua im lặng, không phải lỗi"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval; `add_members` đã idempotent, và người dùng thêm lần hai vì không chắc lần một xong chưa"

[[assumption]]
id = "A-08"
text = "Đổi Môn của một đề đã có câu hỏi vẫn cho phép"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval; xem ADR-03 — câu đã có giữ nguyên, môn chỉ đổi phạm vi ma trận, và màn hình nói ra điều đó"

[[assumption]]
id = "A-09"
text = "Tên đề ôn cá nhân link sang báo cáo bài giao (`/org/assignments/{id}`), không sang trang đề"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval; người dạy bấm vào để xem em ấy làm ra sao, không phải để sửa đề"

