[[ac]]
id = "AC-01"
title = "Stack starts"
story = "US-01 — Run the whole stack locally"
given = "a clean checkout with .env copied from .env.example"
when = "I run docker compose up -d"
then = "postgres, minio, api, web and caddy become healthy, and GET /api/health returns 200 with {\"status\":\"ok\",\"db\":\"ok\",\"storage\":\"ok\"}"

[[ac]]
id = "AC-02"
title = "Migrations and seed"
story = "US-01 — Run the whole stack locally"
given = "the database is empty"
when = "the api container starts"
then = "Alembic migrations run to head, and the system org and the super admin from env exist exactly once, even after restarts"

[[ac]]
id = "AC-03"
title = "Happy path"
story = "US-02 — Log in with organisation code"
given = "an active org \"trungtama\" with user \"hs01\" and password \"Secret123!\""
when = "I submit org \"TrungtamA\", username \"HS01\", password \"Secret123!\""
then = "I am redirected to my role's home page, and access and refresh cookies are set httpOnly"

[[ac]]
id = "AC-04"
title = "Generic failure"
story = "US-02 — Log in with organisation code"
given = "any of: unknown org, unknown user, wrong password, inactive user"
when = "I submit the login form"
then = "I see \"Sai tổ chức, tên đăng nhập hoặc mật khẩu\", and the response is identical for every case (status 401, same body)"

[[ac]]
id = "AC-05"
title = "Suspended or deleted org"
story = "US-02 — Log in with organisation code"
given = "org \"trungtama\" is suspended or soft-deleted"
when = "a user of that org logs in with correct credentials"
then = "login is refused with \"Tổ chức đang bị khóa\", and any existing refresh tokens of that org no longer refresh"

[[ac]]
id = "AC-06"
title = "Lockout"
story = "US-02 — Log in with organisation code"
given = "5 failed attempts for (trungtama, hs01) within 15 minutes"
when = "a 6th attempt is made, even with the right password"
then = "it is refused with status 429 until 15 minutes have passed"

[[ac]]
id = "AC-07"
title = "Remember org code"
story = "US-02 — Log in with organisation code"
given = "I logged in successfully with org \"TrungtamA\" before on this browser"
when = "I open /login again"
then = "the org field is prefilled with \"TrungtamA\""

[[ac]]
id = "AC-08"
title = "Session refresh and logout"
story = "US-02 — Log in with organisation code"
given = "my access token expired and my refresh token is valid"
when = "the web app calls the API"
then = "it refreshes transparently and the call succeeds, and after I log out the refresh token is revoked"

[[ac]]
id = "AC-09"
title = "Forced change"
story = "US-03 — Forced password change"
given = "my account has must_change_password = true"
when = "I log in"
then = "every page except /change-password redirects there, and after I set a new password (≥ 8 chars, not equal to the old one) I reach my home page"

[[ac]]
id = "AC-10"
title = "Create org with first admin"
story = "US-04 — Super admin manages organisations"
given = "I am super_admin"
when = "I create org code \"TrungtamA\", name \"Trung tâm A\", admin username \"admin\""
then = "the org exists with code \"trungtama\" and the seeded topic tree, subjects, grades, semesters, and I am shown the admin's temporary password once"

[[ac]]
id = "AC-11"
title = "Duplicate or invalid code"
story = "US-04 — Super admin manages organisations"
given = "org \"trungtama\" exists"
when = "I create another org with code \"TRUNGTAMA\" or \"trung tam!\""
then = "I see a field error and nothing is created"

[[ac]]
id = "AC-12"
