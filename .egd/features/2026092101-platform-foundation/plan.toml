when = "I preview the import"
then = "rows 7 and 9 are reported with reasons and nothing is created until I fix or skip them"

[[ac]]
id = "AC-18"
title = "Reset password"
story = "US-05 — Org admin manages users and classes"
given = "a student forgot their password"
when = "a teacher or org_admin resets it"
then = "a new temporary password is shown once, must_change_password is set, and old refresh tokens are revoked"

[[ac]]
id = "AC-19"
title = "Tenant isolation"
story = "US-05 — Org admin manages users and classes"
given = "users exist in orgs A and B"
when = "an org_admin of A lists, reads or edits users or classes"
then = "they only ever see A's data, and requesting a B id returns 404"

[[ac]]
id = "AC-20"
title = "Classes"
story = "US-05 — Org admin manages users and classes"
given = "I am org_admin or teacher"
when = "I create class \"10A1\" (grade 10, school year 2026-2027) and add or remove students"
then = "the class shows its members and a student can belong to several classes"

[[ac]]
id = "AC-21"
title = "Browse and edit the tree"
story = "US-06 — Topic tree and tags"
given = "my org was seeded with the Toán 10–12 tree"
when = "I open /org/topics"
then = "I can expand \"Giải tích › Nguyên hàm\" and add child \"Nguyên hàm từng phần\", and I can rename, move (drag or \"move to\") and delete leaf nodes; paths update for the whole subtree"

[[ac]]
id = "AC-22"
title = "Merge and guard"
story = "US-06 — Topic tree and tags"
given = "node X has children"
when = "I delete X I merge X into Y"
then = "it is refused with a message X's children move under Y and X disappears"

[[ac]]
id = "AC-23"
title = "Tags"
story = "US-06 — Topic tree and tags"
given = "I am teacher or org_admin"
when = "I create tag \"đổi biến\" in group method, rename it, and delete it"
then = "the tag list per group reflects each change and duplicates in the same group are refused"

[[ac]]
id = "AC-24"
title = "QuestionView"
story = "US-07 — Render a question fully"
given = "a question with LaTeX in the stem, an image in option C and a multi-step solution with an image"
when = "it is rendered in mode \"review\" it is rendered in mode \"exam\""
then = "math renders with KaTeX, images appear in their fields, answer and solution are visible answer and solution are hidden, and empty parts render no empty box"

[[decision]]
id = "ADR-01"
title = "Self-host everything in one Docker Compose"
status = "accepted"
choice = "** Compose with postgres, minio, api, web, caddy (+ worker, ollama in later features); no BaaS"

[[decision]]
id = "ADR-02"
title = "Org-code login with per-org usernames"
status = "accepted"
choice = "** Login key is (org code, username); `organization_id` UUID stays the internal FK; code editable"

[[decision]]
id = "ADR-03"
title = "Tenancy enforced in the service layer"
status = "accepted"
choice = "** `OrgScope` dependency; every service query filters `organization_id`; cross-org ids return 404; isolation covered by tests"

[[decision]]
id = "ADR-04"
title = "Topics as `ltree` materialised paths"
status = "accepted"
choice = "** `topics.path ltree` built from slugs of ids (`t<short-id>` labels) plus `parent_id`; move/merge rewrite subtree paths in one transaction"

[[decision]]
id = "ADR-05"
title = "Cookie JWT through a same-origin reverse proxy"
status = "accepted"
choice = "** Caddy serves both under one origin; API sets httpOnly SameSite=Lax cookies; refresh tokens are opaque, hashed, rotated"

[[decision]]
id = "ADR-06"
title = "Web tests outside route-group folders"
status = "accepted"
choice = "** Page-level tests live in `apps/web/src/__tests__/`; component tests sit next to components"

[[decision]]
id = "ADR-07"
title = "Raster images only; SVG uploads rejected"
status = "accepted"
choice = "** Accept PNG/JPEG/GIF/WEBP by magic-byte sniffing, `X-Content-Type-Options: nosniff`, org-checked `GET /api/assets/{id}`"

[[decision]]
id = "ADR-08"
title = "Dev ports and compose override"
status = "accepted"
choice = "** Caddy on 8088/8448; dev override exposes Postgres 55442, MinIO 59100/59101, API 58100; local `.env` sets `COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml`; the VM omits the override"

[[slice]]
id = "UOW-01"
title = "Stack runs and users log in with org code"
covers = ["AC-01", "AC-02", "AC-03", "AC-04", "AC-05", "AC-06", "AC-07", "AC-08", "AC-09"]
demo = """
1. cp .env.example .env && docker compose up -d --build
2. Open http://localhost:8088/api/health → status ok, db ok, storage ok
3. Open http://localhost:8088/login, enter org `system`, `admin`, `admin12345` → forced to /change-password
4. Set a new password → land on the super admin home
5. Log out, log in with a wrong password → generic error; reload /login → org field prefilled"""

[[slice]]
