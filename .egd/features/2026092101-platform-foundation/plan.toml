[[assumption]]
id = "A-01"
text = "Org code is 3–32 chars of `[a-z0-9-]`, stored lower-case, matched case-insensitively (`TrungtamA` == `trungtama`)"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-21) — to confirm at final review"

[[assumption]]
id = "A-02"
text = "Username unique per org, case-insensitive, `[a-z0-9._-]` 3–64 chars; auto-generated from full name without diacritics when CSV leaves it blank (`nguyenvana`, then `nguyenvana2`)"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-21) — to confirm at final review"

[[assumption]]
id = "A-03"
text = "Roles are exactly `super_admin`, `org_admin`, `teacher`, `student`; one role per user"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-21) — to confirm at final review"

[[assumption]]
id = "A-04"
text = "super_admin lives in a reserved org `system` that cannot be edited, suspended or deleted"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-21) — to confirm at final review"

[[assumption]]
id = "A-05"
text = "Teachers may create students and reset student passwords, but not manage other teachers or admins"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-21) — to confirm at final review"

[[assumption]]
id = "A-06"
text = "Access token 15 min, refresh token 30 days, both httpOnly SameSite=Lax cookies; refresh tokens stored hashed and revoked on org suspend / password reset"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-21) — to confirm at final review"

[[assumption]]
id = "A-07"
text = "Lockout: 5 failed logins for the same (org, username) within 15 min → locked 15 min; per-IP limit 30/min"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-21) — to confirm at final review"

[[assumption]]
id = "A-08"
text = "CSV columns: `full_name` (required), `username`, `role` (default student), `class`; UTF-8 with or without BOM; `.xlsx` also accepted; max 2000 rows"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-21) — to confirm at final review"

[[assumption]]
id = "A-09"
text = "Temp passwords are 10 chars from an unambiguous alphabet, returned once in a downloadable CSV and never retrievable again"
blocking = false
