blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-21) — to confirm at final review"

[[assumption]]
id = "A-11"
text = "Subjects, grades (6–12) and semesters (HK1/HK2) are fixed seed data per org in this feature; editing them is out of scope"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-21) — to confirm at final review"

[[assumption]]
id = "A-12"
text = "Tags are per org with a group ∈ method/skill/source/custom; name unique per (org, group)"
blocking = false
