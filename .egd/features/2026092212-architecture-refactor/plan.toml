# Imported from ai-dlc (ai-dlc:2026092212-architecture-refactor) on 2026-10-05.
# ids are kept as they were, so tickets, commits and history still line up.

[feature]
title = "Layered API modules and a query-driven web client"
tier = "standard"
client = ""
imported_from = "ai-dlc:2026092212-architecture-refactor"

[[assumption]]
id = "A-01"
text = "The API contract may change (web is the only client): list endpoints become `POST /<resource>/search` with typed filter objects and return `{data,total,page,limit}`; errors become `{code,message,details}`"
blocking = true
status = "confirmed"
resolution = "Confirmed by Loc Tran in chat (2026-09-22): \"Cho phép đổi\""

[[assumption]]
id = "A-02"
text = "JSON stays snake_case and auth stays in httpOnly cookies"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-03"
text = "Next.js App Router stays; the folder convention is applied inside `src/`"
blocking = true
status = "confirmed"
resolution = "Confirmed by Loc Tran in chat (2026-09-22)"

[[assumption]]
id = "A-04"
text = "Every API module gets the four layers, simple CRUD included"
blocking = true
status = "confirmed"
resolution = "Confirmed by Loc Tran in chat (2026-09-22)"

[[assumption]]
id = "A-05"
text = "Domain objects are plain dataclasses mapped imperatively by SQLAlchemy; the schema and Alembic history do not change"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-06"
text = "Table state stays in the URL; the web converts it to the search body"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-07"
text = "Ingestion algorithms (MathType, splitter, header, vector images) move without behaviour change; the official golden numbers must not move"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[assumption]]
id = "A-08"
text = "Existing HTTP tests are updated for the new URLs/shapes only; their assertions keep their meaning"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval by Loc Tran (chat, 2026-09-22) — to confirm at final review"

[[ac]]
id = "AC-01"
title = "Dependency rule enforced"
story = "US-01 — Layered API modules"
given = "the API package"
when = "`lint-imports` runs"
then = "every module keeps interface → application → domain, infrastructure depends only inward, domain imports no sqlalchemy/fastapi/pydantic/boto3, modules use only another module's application layer, and shared never imports modules"

[[ac]]
id = "AC-02"
title = "Search contract"
story = "US-01 — Layered API modules"
given = "a list resource"
when = "the client posts {page, limit, q, sort, filters} to /<resource>/search with string (* = + - !), compare (= < <= > >=), date-range or enum filters"
then = "the answer is {data, total, page, limit}, the old GET list is gone, and an unknown field or operator answers 422 bad_filter"

[[ac]]
id = "AC-03"
title = "Error shape"
story = "US-01 — Layered API modules"
given = "any failing request"
when = "the API answers"
then = "the body is {code, message, details: {fields?, requestId}} and the X-Request-Id header matches details.requestId"

[[ac]]
id = "AC-04"
title = "One data path"
story = "US-02 — Query-driven web client"
given = "the web source"
when = "lint runs"
then = "only services/ call the http client, only hooks/react-query use React Query, routes hold no data logic, and useApi / reloadKey no longer exist"

[[ac]]
id = "AC-05"
title = "Cache and invalidation"
story = "US-02 — Query-driven web client"
given = "a list and a form"
when = "a record is created, edited or deleted, or the organisation is switched"
then = "the affected queries refetch without a manual reload, and switching organisation clears the cache without a full page reload"

[[ac]]
id = "AC-06"
title = "No regression"
story = "US-03 — Same behaviour"
given = "the refactored code"
when = "the API suite, the official golden set and the web suite run and each page is walked in the browser"
then = "they pass with the same results as before the refactor"

[[ac]]
id = "AC-07"
title = "Architecture map"
story = "US-04 — Documented structure"
given = ".ai/architecture.md"
when = "a developer adds a feature"
then = "it names every folder, the file-naming rules and the dependency rules for web and API"

[[ac]]
id = "AC-08"
title = "Own conventions"
story = "US-04 — Documented structure"
given = "docs, ADRs, code comments and commit messages written from now on"
when = "they are searched for names of other projects"
then = "nothing is found; the conventions read as Examind's own"

[[decision]]
id = "ADR-01"
title = "Dataclass entities mapped imperatively on a shared physical schema"
status = "accepted"
choice = "** `shared/infrastructure/schema/*` holds the `Table` objects (the physical schema, also Alembic's metadata)"

[[decision]]
id = "ADR-02"
title = "Commands through repositories and a unit of work, queries through read models"
status = "accepted"
choice = "** Command handlers load/save aggregates through repository ports and call `uow.commit()`"

[[decision]]
id = "ADR-03"
title = "Search endpoint with typed filters"
status = "accepted"
choice = "** `POST /<resource>/search`; each filter is `{operator?, value?, from?, to?}` read by the column kind: text (`* = + - !`), number/date/day (`= < <= > >=` or from/to), enum/uuid/bool (`value`, a list = any of)"

[[decision]]
id = "ADR-04"
title = "Error body and request id"
status = "accepted"
choice = "** `{code, message, details: {fields?, requestId}}`; middleware sets `X-Request-Id` (echoes a valid incoming one)"

[[decision]]
id = "ADR-05"
title = "Dependency rules are linted"
status = "accepted"
choice = "** `import-linter` contracts (layers per module, forbidden framework imports in domain, modules talk through `application`, shared never imports modules) run in `scripts/verify.sh`; ESLint restricts imports on the web side"

[[decision]]
id = "ADR-06"
title = "React Query owns server state"
status = "accepted"
choice = "** One QueryClient (staleTime 0, retry 1, no refetch on focus); keys in `constants/react-query-key.constant.ts` (`<ENTITY>_KEYS`, first element = resource); lists use `keepPreviousData`; mutations invalidate `<ENTITY>_KEYS.ALL`; switching organisation clears the cache"

[[decision]]
id = "ADR-07"
title = "snake_case JSON and cookie sessions stay"
status = "accepted"
choice = "** Keep snake_case and httpOnly cookies"

