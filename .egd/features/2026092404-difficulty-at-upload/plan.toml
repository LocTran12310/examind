[feature]
title = "Mức độ được gán ngay lúc tách đề"
tier = "standard"
client = ""
imported_from = "ai-dlc:2026092404-difficulty-at-upload"

[[assumption]]
id = "A-01"
text = "Mức độ được gán thẳng lúc tách đề, kèm dấu vết nói rõ do máy gán"
blocking = true
status = "confirmed"
resolution = "Loc Tran chọn trong chat (2026-09-24)"

[[assumption]]
id = "A-02"
text = "Hai tín hiệu: model của tổ chức, và vị trí câu trong đề (Phần I/II/III + số thứ tự). Không dùng số liệu làm bài"
blocking = true
status = "confirmed"
resolution = "Loc Tran chọn trong chat (2026-09-24)"

[[assumption]]
id = "A-03"
text = "Máy không bao giờ đè lên mức độ mà một người đã đặt — `manual` là bất khả xâm phạm"
blocking = true
status = "confirmed"
resolution = "Accepted under blanket pre-approval; đây là điều kiện để \"gán thẳng\" không phá công của giáo viên"

[[assumption]]
id = "A-04"
text = "Dấu vết là một cột mới trên `questions` (`auto` / `ai` / `manual`), soi theo đúng cách `question_topics.source` đang làm"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval; chuyên đề đã có đúng khái niệm này và nó đang dùng được"

[[assumption]]
id = "A-05"
text = "Quy tắc vị trí là một quy ước của đề THPT 2025, không phải sự thật về một câu cụ thể: nó lấp chỗ model không trả lời, và nhường model khi model trả lời"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval — **và phải đo trước khi chốt ai dẫn**; con số đo được ghi vào review cuối"

[[assumption]]
id = "A-06"
text = "Có lệnh điền cho các câu đã có sẵn mà chưa có mức độ, chạy được nhiều lần và chỉ chạm câu đang rỗng"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval; không có nó thì 374 câu của Loc Tran vẫn rỗng cho tới khi tải lại đề"

[[assumption]]
id = "A-07"
text = "Mức độ sửa được ngay trong hàng đợi duyệt, chỗ giáo viên đang nhìn từng câu"
blocking = false
status = "confirmed"
resolution = "Accepted under blanket pre-approval; máy đã đặt thì phải sửa được ở chỗ đang xem lại"

[[ac]]
id = "AC-01"
title = "Mọi câu đều có mức độ"
story = "US-01 — Tách đề xong là có mức độ"
